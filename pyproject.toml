[project]
name = "enterprise-bi-controllai-agent"
version = "0.2.0"
description = "KI-gestützter Data- und Controlling-Agent für die strategische Unternehmenssteuerung"
authors = [{ name = "Sherwan Shweish" }]
license = { text = "MIT" }
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
